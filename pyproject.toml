[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cellassign"
version = "2.0.0"
description = "Lightweight marker-based cell category assignment for AnnData objects."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Alex Mascension", email = "alexmascension@gmail.com" },
]
keywords = [
  "single-cell",
  "scanpy",
  "anndata",
  "cell-type-annotation",
  "marker-genes",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "anndata>=0.8",
  "numpy>=1.21",
  "pandas>=1.3",
  "scipy>=1.7",
]

[project.optional-dependencies]
scanpy = ["scanpy>=1.9"]
dev = [
  "build>=1.0",
  "pytest>=8.0",
  "ruff>=0.6",
  "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/alexmascension/cell_asign"
Repository = "https://github.com/alexmascension/cell_asign"
Issues = "https://github.com/alexmascension/cell_asign/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 99
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["cellassign"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"


[tool.pytest.ini_options]
markers = [
  "scanpy: tests requiring the optional scanpy dependency",
]
