name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff format
        run: ruff format --check .

      - name: Ruff lint
        run: ruff check .

      - name: Build package
        run: python -m build

  test-core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Show versions
        run: |
          python - <<'PY'
          import sys
          import anndata
          import numpy
          import pandas
          import scipy
          import cellassign

          print("python", sys.version)
          print("cellassign", cellassign.__version__)
          print("anndata", anndata.__version__)
          print("numpy", numpy.__version__)
          print("pandas", pandas.__version__)
          print("scipy", scipy.__version__)
          PY

      - name: Run tests
        run: pytest -q

  test-scanpy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            scanpy-version: "1.10.4"
          - python-version: "3.11"
            scanpy-version: "1.11.5"
          - python-version: "3.12"
            scanpy-version: ""
          - python-version: "3.13"
            scanpy-version: ""
          - python-version: "3.14"
            scanpy-version: ""

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,scanpy]"
          if [ -n "${{ matrix.scanpy-version }}" ]; then
            python -m pip install "scanpy==${{ matrix.scanpy-version }}"
          fi

      - name: Run scanpy tests
        run: pytest -q -m scanpy
